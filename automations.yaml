- id: '1755722221689'
  alias: Away mode
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.anybody
    to:
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.anybody
        state: 'on'
      sequence:
      - action: automation.turn_on
        metadata: {}
        target:
          entity_id: '{{ label_entities(''motions'') + label_entities(''when_at_home'')
            }}'
        enabled: true
        data: {}
    - conditions:
      - condition: state
        entity_id: binary_sensor.anybody
        state: 'off'
      sequence:
      - action: script.turn_on
        metadata: {}
        data: {}
        target:
          entity_id: script.turn_off_all_lights
      - action: automation.turn_off
        metadata: {}
        data:
          stop_actions: true
        target:
          entity_id: '{{ label_entities(''motions'') + label_entities(''when_at_home'')
            }}'
        enabled: true
      - action: climate.set_temperature
        metadata: {}
        target:
          entity_id:
          - climate.bedroom_thermostat
          - climate.eric_s_office_thermostat
          - climate.theatre_thermostat
        data:
          temperature: 19
