        - delay:
            hours: 0
            minutes: 0
            seconds: 3
            milliseconds: 500
        - action: light.turn_on
          metadata: {}
          target:
            entity_id:
            - light.chandelier
          data:
            transition: 1
            brightness_pct: 10
        - delay:
