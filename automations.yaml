- id: '1784319640024'
  alias: Dimmer button
  description: ''
  triggers:
  - trigger: device
    domain: mqtt
    device_id: d20118038553ef72303ef35e0f2e321d
    type: action
    subtype: single
    id: single press
  - trigger: device
    domain: mqtt
    device_id: d20118038553ef72303ef35e0f2e321d
    type: action
    subtype: double
    id: double press
  - trigger: device
    domain: mqtt
    device_id: d20118038553ef72303ef35e0f2e321d
    type: action
    subtype: hold
    id: long press
  - trigger: mqtt
    topic: zigbee2mqtt/Dimmer button
    id: rotate
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: single press
      sequence:
      - action: light.toggle
        target:
          entity_id: light.theatre
    - conditions:
      - condition: trigger
        id: double press
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.theatre
        data:
          brightness_pct: 100
    - conditions:
      - condition: trigger
        id: long press
      sequence:
      - if:
        - condition: state
          entity_id: input_select.sync_box_settings
          state:
          - 'On'
        then:
        - action: input_select.select_option
          target:
            entity_id: input_select.sync_box_settings
          data:
            option: On while playing TV
        else:
        - action: input_select.select_option
          target:
            entity_id: input_select.sync_box_settings
          data:
            option: 'On'
    - conditions:
      - condition: trigger
        id: rotate
      - condition: template
        value_template: '{{ trigger.payload_json.action in [''rotate_right'', ''rotate_left'']
          }}'
      sequence:
      - variables:
          size: '{{ trigger.payload_json.action_step_size | int(13) }}'
          direction: '{{ 1 if trigger.payload_json.action == ''rotate_right'' else
            -1 }}'
          sensitivity: 1.6
          step: '{{ (direction * ([size * sensitivity, 2] | max)) | round(0) | int
            }}'
      - action: light.turn_on
        target:
          entity_id: light.theatre
        data:
          brightness_step_pct: '{{ step }}'
  mode: queued
  max: 20
- id: '1785501252257'
  alias: Plancher des plinthes en mode ete
  description: Les plinthes de la chambre, du bureau et du cinema ne sont pas gerees
    par le controleur climatique. Sans ce plancher elles chauffent pendant que la
    thermopompe climatise. Epinglees a 16 C tant que le mode ete est actif, restaurees
    a leurs consignes d'hiver quand il se termine.
  triggers:
  - trigger: state
    entity_id: input_boolean.climate_summer_mode
    to: 'on'
    id: summer_on
  - trigger: state
    entity_id: input_boolean.climate_summer_mode
    to: 'off'
    id: summer_off
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: summer_on
      sequence:
      - action: climate.set_temperature
        target:
          entity_id:
          - climate.bedroom_thermostat
          - climate.eric_s_office_thermostat
          - climate.theatre_thermostat
        data:
          temperature: 16
        note: 16 C = meme plancher que aux_summer_floor du controleur climatique.
    - conditions:
      - condition: trigger
        id: summer_off
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.bedroom_thermostat
        data:
          temperature: 19
      - action: climate.set_temperature
        target:
          entity_id:
          - climate.eric_s_office_thermostat
          - climate.theatre_thermostat
        data:
          temperature: 20
        note: 20 C = valeur de repli utilisee par 'Turn up heat while lights are on'
          et 'Sync heat with lights'.
  mode: single
- id: '1785700851591'
  alias: Chandelier on when opening the front door
  description: Turns on the entrance chandelier when the front door opens, then turns
    it back off 5 minutes after the last opening — but only when it was not already
    on.
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.front_door_open
    to: 'on'
  conditions:
  - condition: state
    entity_id: light.chandelier
    state: 'off'
    note: Already on means someone turned it on deliberately — leave it alone.
  actions:
  - action: light.turn_on
    target:
      entity_id: light.chandelier
    data:
      transition: 2
  - repeat:
      sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id:
          - binary_sensor.front_door_open
          to: 'on'
        timeout: 00:05:00
        continue_on_timeout: true
      until:
      - condition: template
        value_template: '{{ not wait.completed }}'
    note: 'The 5 min restarts inside the run rather than via mode: restart — a restarted
      run would see the chandelier already on (turned on by us) and would never turn
      it off.'
  - action: light.turn_off
    target:
      entity_id: light.chandelier
    data:
      transition: 2
  mode: single
  max_exceeded: silent
