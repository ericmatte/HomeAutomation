homeassistant:
  name: Home
  latitude: !secret latitude
  longitude: !secret longitude
  elevation: !secret elevation
  unit_system: metric
  time_zone: America/Toronto
  country: "CA"
  currency: CAD
  internal_url: !secret internal_url
  # external_url: !secret external_url
  # customize: !include customize.yaml

frontend:
  themes: !include_dir_merge_named themes

recorder:
  auto_purge: true
  purge_keep_days: 90

my:
mobile_app:
config:
system_health:
default_config:
history:
logbook:
sun:

http:
  login_attempts_threshold: 50
  ip_ban_enabled: False

# logger:
#   default: warning
#   logs:
#     homeassistant.components.switch.command_line: critical

# zwave:
#   usb_path: /dev/ttyACM1 # /dev/ttyACM0

smartir:
  check_updates: false

climate:
  - platform: smartir
    name: Heat pump
    unique_id: heat_pump
    device_code: 1281 # elios-heat-pump-smartir-codes.json
    controller_data: remote.rm4
    temperature_sensor: sensor.rm4_temperature
    humidity_sensor: sensor.rm4_humidity

command_line:
  - sensor:
      name: CPU temperature
      command: "cat /sys/class/thermal/thermal_zone0/temp"
      unit_of_measurement: "°C"
      value_template: "{{ value | multiply(0.001) | round(1) }}"
  - sensor:
      name: Database filesize
      command: "du -m /config/home-assistant_v2.db | cut -f1"
      unit_of_measurement: "MB"
      value_template: "{{ value | int - 1 }}"

utility_meter:
  hydro_sherbrooke_daily:
    source: sensor.hydro_sherbrooke_reading
    name: Hydro Sherbrooke daily consumption
    cycle: daily

sensor:
  - platform: derivative
    source: sensor.hydro_sherbrooke_reading
    name: Hydro Sherbrooke power
    unit_time: h
    unit: kW
    time_window: "00:05:00"
    round: 3

template:
  - sensor:
      - name: Propane Tank Level
        unit_of_measurement: "%"
        device_class: battery
        unique_id: rainville_propane_tank
        default_entity_id: sensor.rainville_propane_tank
        state: "{{ states('sensor.rainville_propane_raw') }}"
        attributes:
          last_updated: "{{ state_attr('sensor.rainville_propane_raw', 'last_updated') }}"
          last_rainville_update: "{{ state_attr('sensor.rainville_propane_raw', 'last_rainville_update') }}"
          next_estimated_delivery: "{{ state_attr('sensor.rainville_propane_raw', 'next_estimated_delivery') }}"

      - name: "Hydro Sherbrooke current price"
        unique_id: hydro_sherbrooke_current_price
        unit_of_measurement: "CAD/kWh"
        state: >
          {% set daily = states('sensor.hydro_sherbrooke_daily_consumption') | float(0) %}
          {% if daily < 40 %}
            0.06905
          {% else %}
            0.10652
          {% endif %}

      - name: "Hydro Sherbrooke daily total cost"
        unique_id: hydro_sherbrooke_daily_total_cost
        unit_of_measurement: "CAD"
        device_class: monetary
        state: >
          {% set daily = states('sensor.hydro_sherbrooke_daily_consumption') | float(0) %}
          {% set access = 0.46154 %}
          {% if daily <= 40 %}
            {% set energy = daily * 0.06905 %}
          {% else %}
            {% set energy = 40 * 0.06905 + (daily - 40) * 0.10652 %}
          {% endif %}
          {{ ((access + energy) * 1.14975) | round(2) }}
        attributes:
          access_fee: 0.46154
          energy_cost: >
            {% set daily = states('sensor.hydro_sherbrooke_daily_consumption') | float(0) %}
            {% if daily <= 40 %}
              {{ (daily * 0.06905) | round(4) }}
            {% else %}
              {{ (40 * 0.06905 + (daily - 40) * 0.10652) | round(4) }}
            {% endif %}
          taxes_rate: 0.14975

      - name: "Hydro Sherbrooke tier 2 marker"
        unique_id: hydro_sherbrooke_tier2_marker
        state: >
          {% if is_state('binary_sensor.hydro_sherbrooke_tier_2_alert', 'on') %}
            5
          {% else %}
            0
          {% endif %}

  - binary_sensor:
      - name: "Hydro Sherbrooke tier 2 alert"
        unique_id: hydro_sherbrooke_tier2_alert
        device_class: problem
        icon: mdi:flash-alert
        state: "{{ states('sensor.hydro_sherbrooke_daily_consumption') | float(0) > 40 }}"

  - button:
      - name: "Fan power"
        unique_id: fan_power
        icon: mdi:power
        press:
          - service: remote.send_command
            target:
              entity_id: remote.rm4
            data:
              device: fan
              command: power

      - name: "Fan speed"
        unique_id: fan_speed
        icon: mdi:fan-speed-2
        press:
          - service: remote.send_command
            target:
              entity_id: remote.rm4
            data:
              device: fan
              command: speed

      - name: "Fan swing"
        unique_id: fan_swing
        icon: mdi:arrow-oscillating
        press:
          - service: remote.send_command
            target:
              entity_id: remote.rm4
            data:
              device: fan
              command: swing

input_select:
  mystery_phase:
    name: Mystery Phase
    icon: mdi:magnify-scan
    options:
      - idle
      - investigation
      - autopsy_done
      - accusation
      - solved
    initial: idle
  # Accusation depuis le terminal CCTV du bureau plutôt qu'au téléphone : la
  # reconnaissance vocale s'est révélée trop peu fiable pour porter la fin.
  mystery_accusation_choice:
    name: Mystery Accusation Choice
    icon: mdi:gavel
    options:
      - none
      - gardener
      - heiress
      - butler
    initial: none

input_text:
  # Le pavé numérique du terminal écrit ici ; l'automation valide puis vide.
  mystery_code_input:
    name: Mystery Code Input
    icon: mdi:dialpad
    max: 8
    initial: ""

input_boolean:
  mystery_gardener_done:
    name: Mystery Gardener Done
    icon: mdi:account-question
  mystery_heiress_done:
    name: Mystery Heiress Done
    icon: mdi:account-question
  mystery_butler_done:
    name: Mystery Butler Done
    icon: mdi:account-question
  # Les 3 objets-indices étiquetés d'un code, saisis au terminal CCTV.
  mystery_evidence_saw:
    name: Mystery Evidence Saw
    icon: mdi:saw-blade
  mystery_evidence_gun:
    name: Mystery Evidence Gun
    icon: mdi:pistol
  mystery_evidence_poison:
    name: Mystery Evidence Poison
    icon: mdi:bottle-tonic-skull
  mystery_terminal_unlocked:
    name: Mystery Terminal Unlocked
    icon: mdi:folder-lock-open
  escape_v2_active:
    name: Escape v2 Active
    icon: mdi:incognito

# Le terminal CCTV de l'escape room v2 est en mode YAML plutôt que dans
# .storage : c'est un écran de jeu versionné, pas un tableau de bord qu'on
# retouche à la souris. `mode: storage` garde tous les autres tels quels.
lovelace:
  mode: storage
  dashboards:
    mystery-terminal:
      mode: yaml
      title: Terminal CCTV
      icon: mdi:cctv
      show_in_sidebar: true
      require_admin: false
      filename: dashboards/mystery-terminal.yaml

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml
