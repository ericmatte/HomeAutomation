mystery_roby_goto:
  alias: Mystery - Roby drives to a clue
  icon: mdi:incognito
  mode: restart
  fields:
    destination:
      name: Destination
      selector:
        select:
          options:
          - wine
          - trap
          - spices
      required: true
    lead_in_seconds:
      name: Wait before leaving (seconds)
      description: Laisse le suspect finir sa réplique avant que Roby démarre.
      selector:
        number:
          min: 0
          max: 120
          step: 1
      default: 0
  variables:
    # spices : rack d'épices en salle à manger, calibré en live le 7 août 2026
    # (8,7 m arrière, 2,2 m à droite du dock). Aucun indice ne s'en sert pour
    # l'instant — gardé exprès : pour rebasculer l'indice du Majordome du vin
    # vers les épices, il suffit de remettre 'spices' dans `destination` de
    # mystery_hint_request. La calibration, elle, coûte une soirée à refaire.
    coords: "{{ {'wine': [23000, 31500],\n    'trap': [25050, 25000],\n    'spices':
      [26700, 31200]}[destination] }}"
    travel_seconds: '{{ 65 if destination == ''wine'' else 100 }}'
    locate_calls: '{{ 1 if destination == ''wine'' else 4 }}'
  sequence:
  - delay:
      seconds: '{{ lead_in_seconds | int }}'
  - action: vacuum.send_command
    target:
      entity_id: vacuum.roborock_s5_7c79_robot_cleaner
    data:
      command: app_goto_target
      params: '{{ coords }}'
  - delay:
      seconds: '{{ travel_seconds | int }}'
  - repeat:
      count: '{{ locate_calls | int }}'
      sequence:
      - action: vacuum.locate
        target:
          entity_id: vacuum.roborock_s5_7c79_robot_cleaner
        continue_on_error: true
      - delay:
          seconds: 25
mystery_hint_request:
  alias: Mystery - Suspect hint (Roby to clue)
  icon: mdi:incognito
  mode: restart
  fields:
    suspect:
      name: Suspect
      description: 'Détermine le message de l''inspecteur et la destination de Roby :
        héritière → trappe du foyer (fusil), majordome → étagère à vins (poison).'
      selector:
        select:
          options:
          - heiress
          - butler
      required: true
  variables:
    message: >-
      {% if suspect == 'heiress' %} Vous ne regardez peut-être pas au bon
      endroit. Mon fidèle acolyte pourrait peut-être vous guider vers une
      meilleure piste ! {% else %} Hmmmm, des fois les apparences sont
      trompeuses.. Je crois que notre ami le robot est sur une piste. {% endif
      %}
    destination: "{{ 'trap' if suspect == 'heiress' else 'wine' }}"
  sequence:
  - action: script.mystery_inspector_say
    data:
      on_terminal: true
      message: '{{ message }}'
  - action: script.turn_on
    target:
      entity_id: script.mystery_roby_goto
    data:
      variables:
        destination: '{{ destination }}'
        lead_in_seconds: 0
mystery_start:
  alias: Mystery Clue
  icon: mdi:incognito
  mode: restart
  fields:
    player_name:
      name: Player name
      selector:
        text: {}
      required: true
    start_delay:
      name: Initial delay (seconds)
