mystery_hint:
  alias: Mystery - Hint
  icon: mdi:lightbulb-question
  mode: single
  variables:
    pending_testimony: "{% set ns = namespace(who=[]) %} {% if is_state('input_boolean.mystery_gardener_done',
      'off') %}\n  {% set ns.who = ns.who + ['du Jardinier'] %}\n{% endif %} {% if
      is_state('input_boolean.mystery_heiress_done', 'off') %}\n  {% set ns.who =
      ns.who + [\"de l'Héritière\"] %}\n{% endif %} {% if is_state('input_boolean.mystery_butler_done',
      'off') %}\n  {% set ns.who = ns.who + ['du Majordome'] %}\n{% endif %} {% if
      ns.who %}{{ ns.who[:-1] | join(', ') }}{{ ' et ' if ns.who | count > 1 }}{{
      ns.who | last }}{% endif %}"
    pending_evidence: "{% set ns = namespace(who=[]) %} {% if is_state('input_boolean.mystery_evidence_saw',
      'off') %}\n  {% set ns.who = ns.who + ['du Jardinier'] %}\n{% endif %} {% if
      is_state('input_boolean.mystery_evidence_gun', 'off') %}\n  {% set ns.who =
      ns.who + [\"de l'Héritière\"] %}\n{% endif %} {% if is_state('input_boolean.mystery_evidence_poison',
      'off') %}\n  {% set ns.who = ns.who + ['du Majordome'] %}\n{% endif %} {% if
      ns.who %}{{ ns.who[:-1] | join(', ') }}{{ ' et ' if ns.who | count > 1 }}{{
      ns.who | last }}{% endif %}"
    evidence_found: "{{ ['input_boolean.mystery_evidence_saw',\n    'input_boolean.mystery_evidence_gun',\n
      \   'input_boolean.mystery_evidence_poison']\n   | map('states') | select('eq',
      'on') | list | count }}"
    hint: '{% set phase = states(''input_select.mystery_phase'') %} {% if phase ==
      ''investigation'' and pending_testimony | trim %} Il me manque encore le témoignage
      {{ pending_testimony | trim }}. Repassez donc par les caméras du bureau, elles
      en disent plus long que moi. {% elif phase == ''investigation'' %} Vous avez
      les trois témoignages. Ne bougez pas, je vous rappelle. {% elif phase == ''autopsy_done''
      and evidence_found | int < 3 %} {{ evidence_found }} pièce{{ ''s'' if evidence_found
      | int > 1 else '''' }} à conviction sur trois. Il me manque celle {{ pending_evidence
      | trim }}. Les caméras du bureau montrent chacun avec son arme — regardez-les
      encore, vous saurez quoi chercher. {% elif phase == ''autopsy_done'' %} Les
      trois pièces sont au dossier. Désignez le coupable sur le terminal. {% elif
      phase == ''accusation'' %} Je vous écoute : désignez le coupable sur le terminal.
      {% else %} Il n''y a pas d''enquête en cours, détective. {% endif %}'
  sequence:
  - action: script.mystery_inspector_say
    data:
      message: '{{ hint }}'
      on_terminal: '{{ states(''input_select.mystery_phase'') == ''accusation'' }}'
mystery_denouement:
  alias: Mystery - Denouement
  icon: mdi:incognito
  mode: single
  fields:
    accused:
      name: Accused suspect
      description: 'Id du suspect désigné : gardener, heiress ou butler.'
      selector:
        text: {}
      default: ''
  variables:
    culprit: butler
    success: '{{ accused == culprit }}'
  sequence:
  - if: '{{ success }}'
    then:
    - action: input_select.select_option
      target:
        entity_id: input_select.mystery_phase
      data:
        option: solved
    - action: media_player.media_stop
      target:
        entity_id: media_player.sonos
      continue_on_error: true
    - action: script.mystery_inspector_say
      data:
        on_terminal: true
        message: >-
          Le Majordome. C'est exact, détective ! Appelez-moi Henri, vous l'avez
          mérité. J'ai trouvé {{ 'quelque chose' if
          is_state('input_boolean.mystery_kid_friendly', 'on') else 'de quoi' }}
          qui pourrait vous intéresser : retournez au mur d'images.
    - alias: Le helper survit à un rechargement de page ; l'événement, lui, ne
        sert qu'à réveiller tout de suite un terminal déjà ouvert
      action: input_text.set_value
      target:
        entity_id: input_text.mystery_reveal_media
      data:
        value: media-source://media_source/local/Final Reveal.mp4
    - event: mystery_terminal_reveal
      event_data:
        media_content_id: media-source://media_source/local/Final Reveal.mp4
    else:
    - action: input_select.select_option
      target:
        entity_id: input_select.mystery_phase
      data:
        option: autopsy_done
    - action: media_player.play_media
      target:
        entity_id: media_player.sonos
      data:
        media_content_type: audio/mpeg
        media_content_id: media-source://media_source/local/Wrong Answer Sting.mp3
    - delay:
        seconds: 3
    - action: media_player.media_stop
      target:
        entity_id: media_player.sonos
      continue_on_error: true
    - action: script.mystery_inspector_say
      data:
        on_terminal: true
        message: Non. Ça ne colle pas, détective. Et c'est Beauchamp-Latulippe. Reprenez
          le vin et les alibis. Revenez me voir quand vous serez sûrs.
    - action: script.turn_on
      target:
        entity_id: script.mystery_ambience
mystery_victory_lap:
  alias: Mystery - Victory lap
  icon: mdi:party-popper
  mode: single
  sequence:
  - action: media_player.play_media
    target:
      entity_id: media_player.sonos
    data:
      media_content_type: audio/mpeg
      media_content_id: media-source://media_source/local/Jamie Foxx - Winner ft Justin
        Timberlake  TI.mp3
    continue_on_error: true
  - action: light.turn_on
    target:
      entity_id:
      - light.bad_light
      - light.metal_lamp
      - light.wooden_lamp
    data:
      effect: prism
      transition: 1
      brightness_pct: 100
    continue_on_error: true
