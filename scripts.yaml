        cycles: 6
        interval: 0.3
  - delay:
      seconds: 12
  - action: media_player.media_stop
    target:
      entity_id: media_player.sonos
    continue_on_error: true
  - action: script.mystery_inspector_say
    data:
      on_sonos: true
      message: 'Bonsoir. Ici inspecteur Henri-Onésime de Beauchamp-Latulippe. {% if
        player_name %}Vous devez être {{ player_name }}. Enchanté de faire votre connaissance.{%
        endif %} Un meurtre a eu lieu ici ce soir, et la maison a tout enregistré!
        Je vous nomme détectives. Trouvez-moi le coupable parmi trois suspects : le
