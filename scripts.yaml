turn_off_all_lights:
  sequence:
  - action: light.turn_off
    metadata: {}
    data: {}
    target:
      floor_id:
      - basement
      - first_floor
      area_id: outside
  - action: media_player.turn_off
    metadata: {}
    data: {}
    target:
      device_id: 67ea5e07670054e7478713b887ed5895
  - action: climate.turn_off
    metadata: {}
    data: {}
    target:
      entity_id: climate.heat_pump
    enabled: false
  alias: Turn off all
  description: ''
  icon: mdi:lightbulb-off
turn_off_things_before_sleeping:
  sequence:
  - action: light.turn_off
    metadata: {}
    data: {}
    target:
      floor_id:
      - basement
      area_id:
      - entrance
      - kitchen
      - living_room
      - hallway
      - outside
      - upstairs_bathroom
      - dining_room
  - action: media_player.turn_off
    metadata: {}
    data: {}
    target:
      device_id: 67ea5e07670054e7478713b887ed5895
  alias: Turn off almost every thing before sleeping
  description: ''
  icon: mdi:lightbulb-off
halloween_lights:
  sequence:
  - action: scene.turn_on
    metadata: {}
    data:
      transition: 2
    target:
      entity_id: scene.halloween
  - repeat:
      until:
      - condition: state
        state: 'off'
        entity_id: light.rgbw_dimmer
      sequence:
      - action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 25
          transition: 4
        target:
          entity_id: light.entrance_lights
      - delay:
          hours: 0
          minutes: 0
          seconds: 4
          milliseconds: 0
      - action: light.turn_on
        metadata: {}
        data:
          brightness_pct: 5
          transition: 4
        target:
          entity_id: light.entrance_lights
      - delay:
          hours: 0
          minutes: 0
          seconds: 4
          milliseconds: 0
  alias: Halloween lights
  description: ''
flash_light_twice:
  alias: Flash light twice
  description: Flash a light from 100% to a dim level twice, then return to 100% smoothly
  mode: single
  fields:
    target_light:
      name: Light to flash
      required: true
      selector:
        entity:
          domain: light
  variables:
    dim_brightness_pct: 20
    step_time: 1
  sequence:
  - action: light.turn_on
    target:
      entity_id: '{{ target_light }}'
    data:
      brightness_pct: 100
      transition: '{{ step_time }}'
  - delay:
      seconds: '{{ step_time }}'
  - repeat:
      count: 2
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ target_light }}'
        data:
          brightness_pct: '{{ dim_brightness_pct }}'
          transition: '{{ step_time }}'
      - delay:
          seconds: '{{ step_time }}'
      - action: light.turn_on
        target:
          entity_id: '{{ target_light }}'
        data:
          brightness_pct: 100
          transition: '{{ step_time }}'
      - delay:
          seconds: '{{ step_time }}'
  - action: light.turn_on
    target:
      entity_id: '{{ target_light }}'
    data:
      brightness_pct: 100
      transition: 2
  - delay:
      seconds: 2
escape_room:
  alias: Escape Room
  mode: restart
  fields:
    player:
      name: Player name
      description: Name of the player
      required: true
      selector:
        text:
    start_delay:
      name: Initial Delay (seconds)
      description: Delay before starting the script
      required: true
      selector:
        number:
          min: 0
          max: 300
          step: 1
      default: 0
  sequence:
  - action: homeassistant.reload_config_entry
    data:
      entry_id: 01KER0F189EWYCFNSKCFX1G46P  # Voice over IP (téléphone HT801V2)
    continue_on_error: true
  - alias: Voix du téléphone pour la v1
    action: select.select_option
    target:
      entity_id: select.192_168_0_160_assistant
    data:
      option: 'Escape Room V1: Denise'
  - delay:
      seconds: '{{ start_delay }}'
  - alias: 'Phase 1: Game instructions'
    sequence:
    - action: assist_satellite.announce
      metadata: {}
      data:
        message: 'Bien le bonjour, est-ce que je parle à {{ player }}?

          Ah ok! Est-ce que tu pourrais lui dire que je l''ai appelé? Ça serait apprécié.
          Je vais rappeler dans quelques secondes.

          Bonne journée!'
        preannounce: false
      target:
        entity_id: assist_satellite.192_168_0_160
    - delay:
        hours: 0
        minutes: 0
        seconds: 8
        milliseconds: 0
    - action: assist_satellite.announce
      metadata: {}
      data:
        message: 'Bien le bonjour très chère {{ player }}! Je t’attendais, et te voilà
          maintenant arrivé.

          Es-tu prête pour une aventure des plus extraordinaire ?

          Que tu sois prête ou pas, il est trop tard pour reculer, alors voici ta
          destiné:

          Trouve les lettres cachées, et le trésor sera gagné.

          Les couleurs sont tes alliées, alors laisse-toi guider.

          À chaque lettre dénichée, une phrase secrète te sera dévoilée.

          Il est maintenant temps pour toi de les découvrir, alors raccroche le téléphone,
          c’est l’heure de commencer!

          N’oublie pas de revenir me dire les phrases trouvées!

          Bonne chance, camarade, ton destin est lancé!!'
        preannounce: false
      target:
        entity_id: assist_satellite.192_168_0_160
    - action: tts.speak
      metadata: {}
      target:
        entity_id: tts.home_assistant_cloud
      data:
        cache: true
        message: 'Bien le bonjour très chère {{ player }}! Je t’attendais, et te voilà
          maintenant arrivé.

          Es-tu prête pour une aventure des plus extraordinaire ?

          Que tu sois prête ou pas, il est trop tard pour reculer, alors voici ta
          destiné:

          Trouve les lettres cachées, et le trésor sera gagné.

          Les couleurs sont tes alliées, alors laisse-toi guider.

          À chaque lettre dénichée, une phrase secrète te sera dévoilée.

          Il est maintenant temps pour toi de les découvrir, alors raccroche le téléphone,
          c’est l’heure de commencer!

          N’oublie pas de revenir me dire les phrases trouvées!

          Bonne chance, camarade, ton destin est lancé!!'
        media_player_entity_id: media_player.sonos
      enabled: false
    - alias: 'Phase 1 [AI]: Find player and tell instructions'
      action: assist_satellite.start_conversation
      metadata: {}
      target:
        entity_id: assist_satellite.192_168_0_160
      data:
        start_message: Salut à toi! Est-ce que je parle à {{ player }}?!
        preannounce: false
        extra_system_prompt: 'On recherche {{ player }}.


          - Si c''est {{ player }} qui répond, récite le txt ci-dessous.

          - Si c''est quelqu''un d''autre qui répond, et tant que tu ne parles pas
          à {{ player }}. continue de demander si quelqu''un l''a vue. Si la personne
          qui te parle te dis qu''elle va te passer {{ player }}, répond une phrase
          en attendant que {{ player }} arrive et se présente. Lorsque ce sera {{
          player }} qui te parle, récite le txt ci-dessous.


          txt à réciter, mot pour mot:

          ```txt

          Super! Je t''attendais, {{ player }}! Es-tu prêt pour une aventure des plus
          extraordinaire? Trouves les lettres cachées et le trésor sera à toi. Les
          couleurs sont tes amis. À chaque lettre trouvée, viens-me la dire, je les
          compilerai. Je te demanderais maintenant de raccrocher le téléphone, et
          la lumière te guidera. Bonne chance!

          ```'
      enabled: false
  - alias: Disable automations
    sequence:
    - action: automation.turn_off
      metadata: {}
      data:
        stop_actions: true
      target:
        entity_id: '{{ label_entities(''motions'') }}'
      enabled: true
    - action: automation.turn_off
      metadata: {}
      target:
        entity_id:
        - automation.sync_auxiliary_light_with_main_light
      data:
        stop_actions: true
  - delay:
      hours: 0
      minutes: 0
      seconds: 4
      milliseconds: 0
  - alias: 'Phase 2: Find the letter T'
    sequence:
    - action: light.turn_on
      metadata: {}
      data:
        transition: 2
        brightness_pct: 5
      target:
        area_id:
        - dining_room
        - kitchen
    - action: light.turn_off
      metadata: {}
      target:
        floor_id:
        - basement
        area_id:
        - living_room
        - bedroom
        - hallway
        - upstairs_bathroom
        - entrance
      data:
        transition: 2
      enabled: true
    - action: media_player.volume_set
      metadata: {}
      target:
        entity_id: media_player.sonos
      data:
        volume_level: 0.35
    - action: media_player.play_media
      metadata: {}
      target:
        entity_id: media_player.sonos
      data:
        enqueue: play
        media:
          media_content_id: media-source://media_source/local/The Magician's Theme.mp3
          media_content_type: audio/mpeg
          metadata:
            title: The Magician's Theme.mp3
            thumbnail:
            media_class: music
            children_media_class:
            navigateIds:
            - {}
            - media_content_type: app
              media_content_id: media-source://media_source
            browse_entity_id: media_player.sonos
    - delay:
        hours: 0
        minutes: 0
        seconds: 4
        milliseconds: 0
    - action: light.turn_on
      metadata: {}
      target:
        entity_id:
        - light.chandelier
      data:
        transition: 1
        brightness_pct: 10
    - action: tts.speak
      metadata: {}
      target:
        entity_id: tts.home_assistant_cloud
      data:
        cache: true
        language: fr-FR
        message: Ah! En passant, je suis toujours là pour toi! Si tu un peu perdu,
          tu peux toujours venir me demander un indice au téléphone. Ok bonne chance
          là!!
        media_player_entity_id: media_player.sonos
        options:
          voice: Denise (whispering)
      alias: Indice
    - delay:
        hours: 0
        minutes: 0
        seconds: 10
        milliseconds: 0
    - action: light.turn_off
      metadata: {}
      target:
        entity_id:
        - light.chandelier
      data:
        transition: 2
    - delay:
        hours: 0
        minutes: 0
        seconds: 4
        milliseconds: 0
    - action: script.flash_light_twice
      metadata: {}
      data:
        target_light: light.hallway_lights
    - delay:
        hours: 0
        minutes: 0
        seconds: 2
        milliseconds: 0
    - action: script.turn_on
      target:
        entity_id: script.rgb_color_loop
      data:
        variables:
          target_light: light.motion_light
    enabled: true
rgb_color_loop:
  alias: RGB Color Loop
  mode: restart
  fields:
    target_light:
      name: Light
      description: Light entity to loop colors on
      required: true
      selector:
        entity:
          domain: light
  variables:
    delay: 1
  sequence:
  - repeat:
      while:
      - condition: template
        value_template: '{{ true }}'
      sequence:
      - action: light.turn_on
        target:
          entity_id: '{{ target_light }}'
        data:
          rgb_color:
          - 255
          - 0
          - 0
          transition: '{{ delay | int }}'
      - delay: '{{ delay }}'
      - action: light.turn_on
        target:
          entity_id: '{{ target_light }}'
        data:
          rgb_color:
          - 0
          - 255
          - 0
          transition: '{{ delay | int }}'
      - delay: '{{ delay }}'
      - action: light.turn_on
        target:
          entity_id: '{{ target_light }}'
        data:
          rgb_color:
          - 0
          - 0
          - 255
          transition: '{{ delay | int }}'
      - delay: '{{ delay }}'
reset_after_escape_roome:
  sequence:
  - action: homeassistant.reload_config_entry
    data:
      entry_id: 01KER0F189EWYCFNSKCFX1G46P  # Voice over IP (téléphone HT801V2)
    continue_on_error: true
  - action: media_player.media_stop
    metadata: {}
    target:
      entity_id:
      - media_player.sonos
      - media_player.workshop_echo
      - media_player.google_home_mini
    data: {}
    continue_on_error: true
  - action: media_player.turn_off
    metadata: {}
    target:
      entity_id: media_player.theatre_tv
    data: {}
  - action: automation.turn_on
    metadata: {}
    target:
      entity_id: '{{ label_entities(''motions'') }}'
    enabled: true
  - action: automation.turn_on
    metadata: {}
    target:
      entity_id:
      - automation.sync_auxiliary_light_with_main_light
    data: {}
  - action: script.turn_off
    metadata: {}
    target:
      entity_id:
      - script.rgb_color_loop
      - script.escape_room
      - script.flash_light_twice
    data: {}
  # Toute la famille mystery_* d'un coup : énumérer les scripts à la main a déjà
  # laissé passer des oublis (un dénouement en cours relançait ses lumières
  # par-dessus la scène de reset).
  - action: script.turn_off
    target:
      entity_id: >-
        {{ states.script | map(attribute='entity_id')
           | select('search', '^script\.mystery_') | list }}
  # Remise à zéro de l'escape room v2 : machine à états, suspects interrogés,
  # preuves et terminal. Même brique qu'au démarrage d'une partie.
  - action: script.mystery_reset_state
  # La garde de cohabitation avec la v1 ne se lève qu'ici : c'est la fin de
  # partie qui rend le matériel partagé à la v1, pas un nouveau départ.
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.escape_v2_active
  # Les enceintes sont poussées fort pendant la partie : sans ça, la salle à
  # manger reste à 90 % pour le reste de la semaine.
  - action: media_player.volume_set
    target:
      entity_id:
      - media_player.sonos
      - media_player.google_home_mini
    data:
      volume_level: 0.35
    continue_on_error: true
  # Chaque escape room impose sa voix au téléphone en démarrant : on rend
  # l'assistant par défaut pour l'usage quotidien.
  - action: select.select_option
    target:
      entity_id: select.192_168_0_160_assistant
    data:
      option: preferred
    continue_on_error: true
  - action: vacuum.return_to_base
    target:
      entity_id: vacuum.roborock_s5_7c79_robot_cleaner
    continue_on_error: true
  - delay:
      hours: 0
      minutes: 0
      seconds: 1
      milliseconds: 0
  - action: scene.turn_on
    metadata: {}
    target:
      entity_id: scene.reset_after_escape_room
    data:
      transition: 2
  - action: script.turn_off
    metadata: {}
    target:
      entity_id:
      - script.rgb_color_loop
      - script.escape_room
      - script.flash_light_twice
    data: {}
  alias: Reset after escape room
  description: ''
# --- Escape room v2 « Meurtre au manoir connecté » -------------------------
# Briques de lumière réutilisables d'abord, scripts de scénario ensuite.

mystery_flash_alternate:
  alias: "Mystery - Alternating light flash"
  icon: mdi:police-badge
  mode: restart
  fields:
    light_a:
      name: First light
      required: true
      selector: { entity: { domain: light } }
    light_b:
      name: Second light
      required: true
      selector: { entity: { domain: light } }
    color_a:
      name: First color (rgb)
      required: true
      selector: { object: {} }
    color_b:
      name: Second color (rgb)
      required: true
      selector: { object: {} }
    cycles:
      name: Number of alternations
      required: true
      selector: { number: { min: 1, max: 100, step: 1 } }
    interval:
      name: Seconds per half-flash
      selector: { number: { min: 0.1, max: 5, step: 0.05 } }
      default: 0.25
  variables:
    # Une seule lampe allumée à la fois : c'est ce qui donne le vrai effet
    # gyrophare (la v1 procède ainsi).
    # ⚠️ On compte en cycles, pas en durée. Les lampes du salon sont des Govee
    # qui mettent un temps fou à accuser réception : le temps réel d'un cycle,
    # c'est `interval` PLUS la latence de quatre appels de service. Déduire un
    # nombre de cycles d'une durée voulue donnait donc une boucle deux à trois
    # fois trop longue — mieux vaut régler le nombre d'alternances à l'œil.
    half_flash_ms: "{{ (interval | float * 1000) | int }}"
  sequence:
    - repeat:
        count: "{{ cycles | int }}"
        sequence:
          - action: light.turn_on
            target: { entity_id: "{{ light_a }}" }
            data: { rgb_color: "{{ color_a }}", brightness_pct: 100 }
          - action: light.turn_off
            target: { entity_id: "{{ light_b }}" }
          - delay: { milliseconds: "{{ half_flash_ms }}" }
          - action: light.turn_on
            target: { entity_id: "{{ light_b }}" }
            data: { rgb_color: "{{ color_b }}", brightness_pct: 100 }
          - action: light.turn_off
            target: { entity_id: "{{ light_a }}" }
          - delay: { milliseconds: "{{ half_flash_ms }}" }
    - action: light.turn_off
      target: { entity_id: ["{{ light_a }}", "{{ light_b }}"] }
      data: { transition: 2 }

mystery_sonos_glow:
  alias: "Mystery - Sonos voice glow"
  icon: mdi:chandelier
  mode: queued
  max: 3
  # Le chandelier et la cuisine respirent un peu chaque fois que quelqu'un
  # parle sur le Sonos (l'inspecteur en T1, l'Héritière ensuite) : ça donne à
  # la voix une présence physique dans la pièce, comme le faisait déjà la v1
  # (script.escape_room, « Phase 2: Find the letter T ») avec le chandelier
  # seul. Non bloquant (script.turn_on) : la durée est juste une estimation de
  # la réplique, elle ne doit jamais retarder l'appelant.
  fields:
    duration_seconds:
      name: Duration (seconds)
      description: Durée estimée de la réplique — le temps que les lumières restent montées.
      required: true
      selector: { number: { min: 1, max: 120, step: 1 } }
  variables:
    # Capturé avant de monter, pour redescendre exactement là où c'était :
    # l'ambiance d'enquête les tient à 6 %, mais l'intro (avant l'ambiance) les
    # trouve éteintes.
    chandelier_before: "{{ state_attr('light.chandelier', 'brightness') }}"
    kitchen_before: "{{ state_attr('light.kitchen_middle_light', 'brightness') }}"
  sequence:
    - action: light.turn_on
      target: { entity_id: [light.chandelier, light.kitchen_middle_light] }
      data: { brightness_step_pct: 15, transition: 1 }
      continue_on_error: true
    - delay: { seconds: "{{ duration_seconds }}" }
    - if: "{{ chandelier_before is none }}"
      then:
        - action: light.turn_off
          target: { entity_id: light.chandelier }
          data: { transition: 1 }
          continue_on_error: true
      else:
        - action: light.turn_on
          target: { entity_id: light.chandelier }
          data: { brightness: "{{ chandelier_before }}", transition: 1 }
          continue_on_error: true
    - if: "{{ kitchen_before is none }}"
      then:
        - action: light.turn_off
          target: { entity_id: light.kitchen_middle_light }
          data: { transition: 1 }
          continue_on_error: true
      else:
        - action: light.turn_on
          target: { entity_id: light.kitchen_middle_light }
          data: { brightness: "{{ kitchen_before }}", transition: 1 }
          continue_on_error: true

mystery_reset_state:
  alias: "Mystery - Reset game state"
  icon: mdi:restore
  mode: single
  # L'état de la partie, remis à zéro en un seul endroit — appelé au démarrage
  # ET par reset_after_escape_roome. Sans ça, relancer une partie sans avoir
  # fait le reset laissait le terminal à 3/3 et les 3 témoignages déjà cochés ;
  # l'autopsie ne partait alors jamais, puisqu'elle attend le passage d'un
  # drapeau à « on ». La garde escape_v2_active n'est pas ici : elle appartient
  # au cycle de vie de la partie, pas à son état.
  sequence:
    - action: input_select.select_option
      target: { entity_id: input_select.mystery_phase }
      data: { option: idle }
    - action: input_select.select_option
      target: { entity_id: input_select.mystery_accusation_choice }
      data: { option: none }
    - action: input_boolean.turn_off
      target:
        entity_id:
          - input_boolean.mystery_gardener_done
          - input_boolean.mystery_heiress_done
          - input_boolean.mystery_butler_done
          - input_boolean.mystery_heiress_gun_seen
          - input_boolean.mystery_heiress_dress_seen
          - input_boolean.mystery_evidence_saw
          - input_boolean.mystery_evidence_gun
          - input_boolean.mystery_evidence_poison
          - input_boolean.mystery_terminal_unlocked
          - input_boolean.mystery_terminal_first_touch
    - action: input_text.set_value
      target: { entity_id: input_text.mystery_code_input }
      data: { value: "" }

mystery_inspector_say:
  alias: "Mystery - Inspector speaks"
  icon: mdi:phone-in-talk
  mode: queued
  max: 3
  # L'inspecteur parle depuis 6 endroits du scénario. Regrouper l'appel ici
  # évite d'avoir l'entité du téléphone en dur partout, et garantit que tous ses
  # messages passent par le même chemin (preannounce désactivé : le téléphone
  # sonne déjà de lui-même à l'appel).
  fields:
    message:
      name: Message
      required: true
      selector: { text: { multiline: true } }
    on_sonos:
      name: Parler sur le Sonos plutôt qu'au téléphone
      description: >-
        Sur place, tout le monde entend — au téléphone, une seule personne
        tient le combiné. Le briefing passe donc par le Sonos.
      selector: { boolean: {} }
      default: false
    on_terminal:
      name: Parler sur le terminal du bureau
      description: >-
        Pour tout ce qui suit une action à l'écran : les joueurs sont au
        sous-sol devant le terminal, le téléphone est au salon.
      selector: { boolean: {} }
      default: false
  variables:
    # tts.speak ne bloque pas et le prochain média couperait l'inspecteur en
    # plein mot : on estime la durée (~2,3 mots/seconde en français) et on
    # attend. announce, lui, bloque déjà tout seul.
    speech_seconds: "{{ [(message.split() | count / 2.3) | round(0, 'ceil') | int, 6] | max }}"
  sequence:
    # Trois canaux mutuellement exclusifs — un choose plutôt que des if
    # imbriqués, sinon le téléphone parlait aussi par-dessus les deux autres.
    - choose:
        # Terminal du bureau : on émet un événement plutôt que d'écrire dans un
        # helper, les messages dépassent les 255 caractères d'un input_text.
        # La carte affiche le texte et joue le TTS elle-même.
        - conditions: "{{ on_terminal }}"
          sequence:
            - event: mystery_terminal_say
              event_data:
                message: "{{ message }}"
            - delay: { seconds: "{{ speech_seconds }}" }
        # Sonos : tout le groupe entend en même temps.
        - conditions: "{{ on_sonos }}"
          sequence:
            - action: media_player.volume_set
              target: { entity_id: media_player.sonos }
              data: { volume_level: 0.6 }
            - action: script.turn_on
              target: { entity_id: script.mystery_sonos_glow }
              data:
                variables: { duration_seconds: "{{ speech_seconds }}" }
              continue_on_error: true
            # HenriNeural n'existe qu'en fr-FR — c'est la même voix que le
            # pipeline du téléphone, pour que ce soit bien le même personnage.
            - action: tts.speak
              target: { entity_id: tts.home_assistant_cloud }
              data:
                cache: true
                language: fr-FR
                media_player_entity_id: media_player.sonos
                message: "{{ message }}"
                options: { voice: HenriNeural }
            - delay: { seconds: "{{ speech_seconds }}" }
      # Par défaut, le téléphone. announce bloque déjà tout seul.
      default:
        - action: assist_satellite.announce
          target: { entity_id: assist_satellite.192_168_0_160 }
          data:
            preannounce: false
            message: "{{ message }}"

mystery_guide_path:
  alias: "Mystery - Light trail guidance"
  icon: mdi:map-marker-path
  mode: restart
  fields:
    lights:
      name: Lights, in walking order
      required: true
      selector: { object: {} }
    trail_brightness_pct:
      name: Brightness left behind
      selector: { number: { min: 1, max: 100, step: 1 } }
      default: 15
  sequence:
    # Chaque lampe du parcours clignote à son tour puis reste allumée en veilleuse :
    # les joueurs voient le chemin se construire, et la traînée reste visible
    # pour ceux qui arrivent en retard.
    - repeat:
        for_each: "{{ lights }}"
        sequence:
          # Le repeat imbriqué masque `repeat.item` : on capture la lampe avant.
          - variables:
              beacon: "{{ repeat.item }}"
          # Le motif commence par l'extinction et finit allumé : terminer sur un
          # turn_off enverrait une commande que la veilleuse défait 400 ms plus
          # tard, et l'appelant attend pendant ce temps.
          - repeat:
              count: 3
              sequence:
                - action: light.turn_off
                  target: { entity_id: "{{ beacon }}" }
                - delay: { milliseconds: 400 }
                - action: light.turn_on
                  target: { entity_id: "{{ beacon }}" }
                  data: { brightness_pct: 100 }
                - delay: { milliseconds: 400 }
          - action: light.turn_on
            target: { entity_id: "{{ beacon }}" }
            data: { brightness_pct: "{{ trail_brightness_pct | default(15) | int }}", transition: 1 }

mystery_ambience:
  alias: "Mystery - Investigation ambience"
  icon: mdi:candle
  mode: restart
  sequence:
    # Musique et lumières d'enquête repartent toujours ensemble. Les trois
    # moments qui coupent le Sonos (intro, rappel d'autopsie, mauvaise
    # accusation) n'ont donc qu'un seul appel à faire, au lieu de recopier le
    # volume et le nom du fichier à chaque fois.
    # 0,52 : +30 % sur les 0,4 du premier test, la musique se perdait derrière
    # les voix des joueurs.
    - action: media_player.volume_set
      target: { entity_id: media_player.sonos }
      data: { volume_level: 0.52 }
      continue_on_error: true
    - action: media_player.play_media
      target: { entity_id: media_player.sonos }
      data:
        media_content_type: audio/mpeg
        media_content_id: "media-source://media_source/local/Investigation Ambience.mp3"
      continue_on_error: true
    # Toute la maison éteinte rendait l'enquête plate et peu praticable : on
    # garde partout une veilleuse tout juste suffisante pour circuler. Les
    # lampes des couloirs sont laissées à mystery_guide_path, qui s'en sert
    # comme balises.
    - action: light.turn_on
      target:
        entity_id:
          - light.chandelier
          - light.dining_room_pendants
          - light.kitchen_lights
      data: { brightness_pct: 6, transition: 3 }
      continue_on_error: true
    # La lampe d'appoint du bureau scintille : le poste de sécurité vit, au
    # lieu d'être un simple coin allumé. Aucune couleur ni luminosité ici —
    # les envoyer avec l'effet le fait retomber aussitôt.
    - action: light.turn_on
      target: { entity_id: light.auxiliary_lamp }
      data: { effect: glisten }
      continue_on_error: true
    # Les lampes du salon « respirent » entre deux teintes sombres tant que
    # l'enquête dure. La boucle s'arrête d'elle-même au dénouement : sa
    # condition suit directement la machine à états. Le plafond de cycles est le
    # filet pour la partie abandonnée sans reset : 450 × 16 s ≈ 2 h, au-delà
    # plus personne ne regarde et ça ne sert qu'à occuper le pont.
    - repeat:
        while:
          - condition: state
            entity_id: input_select.mystery_phase
            state: [investigation, autopsy_done, accusation]
          - condition: template
            value_template: "{{ repeat.index <= 450 }}"
        sequence:
          - action: light.turn_on
            target: { entity_id: [light.left_floor_lamp, light.right_floor_lamp] }
            data: { rgb_color: [90, 0, 130], brightness_pct: 35, transition: 6 }
          - delay: { seconds: 8 }
          - action: light.turn_on
            target: { entity_id: [light.left_floor_lamp, light.right_floor_lamp] }
            data: { rgb_color: [130, 25, 10], brightness_pct: 8, transition: 6 }
          - delay: { seconds: 8 }

mystery_roby_goto:
  alias: "Mystery - Roby drives to a clue"
  icon: mdi:incognito
  # restart : les deux parcours partagent le même robot, le second annule
  # simplement le premier si les joueurs interrogent les suspects dans le
  # désordre.
  mode: restart
  fields:
    destination:
      name: Destination
      selector:
        select:
          options: ["wine", "spices"]
      required: true
    lead_in_seconds:
      name: Wait before leaving (seconds)
      description: Laisse le suspect finir sa réplique avant que Roby démarre.
      selector: { number: { min: 0, max: 120, step: 1 } }
      default: 0
  variables:
    # Les deux cibles sont calibrées en live. Repère : dock ≈ [24500, 22500],
    # +Y = vers l'arrière (salle à manger), −X = vers la gauche, 1000 = 1 m.
    # wine   : étagère d'alcools et de vins — 9 m arrière, 1,5 m à gauche.
    # spices : rack d'épices — 8,7 m arrière, 2,2 m à droite.
    coords: >-
      {{ {'wine': [23000, 31500],
          'spices': [26700, 31200]}[destination] }}
    # Parcours 1 : les joueurs suivent Roby en direct, le locate ne sert qu'à
    # marquer l'arrivée. Parcours 2 : il part discrètement pendant qu'ils sont
    # à l'atelier, donc on attend qu'ils soient remontés avant de l'appeler,
    # et on répète pour qu'ils puissent le localiser à l'oreille.
    travel_seconds: "{{ 65 if destination == 'wine' else 100 }}"
    locate_calls: "{{ 1 if destination == 'wine' else 4 }}"
  sequence:
    # Le suspect annonce le départ de Roby dans sa réplique : s'il partait
    # pendant qu'elle joue, les joueurs le rateraient.
    - delay: { seconds: "{{ lead_in_seconds | int }}" }
    - action: vacuum.send_command
      target:
        entity_id: vacuum.roborock_s5_7c79_robot_cleaner
      data:
        command: app_goto_target
        params: "{{ coords }}"
    - delay: { seconds: "{{ travel_seconds | int }}" }
    - repeat:
        count: "{{ locate_calls | int }}"
        sequence:
          - action: vacuum.locate
            target:
              entity_id: vacuum.roborock_s5_7c79_robot_cleaner
            continue_on_error: true
          - delay: { seconds: 25 }

mystery_start:
  alias: "Mystery - Start"
  icon: mdi:incognito
  mode: restart
  fields:
    player_name:
      name: Player name
      description: >-
        Nom du groupe ou de l'invité d'honneur. L'inspecteur le salue en
        arrivant. Laissé vide, il enchaîne sans la salutation.
      selector: { text: {} }
      default: ""
    start_delay:
      name: Initial delay (seconds)
      selector:
        number: { min: 0, max: 300, step: 1 }
      default: 0
  sequence:
    - action: homeassistant.reload_config_entry
      data:
        entry_id: 01KER0F189EWYCFNSKCFX1G46P  # Voice over IP (téléphone HT801V2)
      continue_on_error: true
    - action: input_boolean.turn_on
      target: { entity_id: input_boolean.escape_v2_active }
    # Une partie repart toujours d'un état propre, même si le reset de la
    # précédente n'a pas été lancé : le terminal se vide dès l'armement, avant
    # même le délai d'attente.
    - action: script.mystery_reset_state
    # La voix de l'inspecteur vient du pipeline Assist du téléphone :
    # assist_satellite.announce n'accepte aucune option de voix. On bascule
    # donc le select avant de parler, ce qui laisse la v1 intacte.
    - alias: Voix du téléphone pour la v2
      action: select.select_option
      target: { entity_id: select.192_168_0_160_assistant }
      data: { option: "Escape Room V2 - Henri" }
    # Son enceinte est réglée une bonne fois ici plutôt qu'à chaque réplique.
    # 0,75 : 0,9 criait un peu au test, mais il faut qu'il porte de la cuisine.
    - action: media_player.volume_set
      target: { entity_id: media_player.google_home_mini }
      data: { volume_level: 0.75 }
      continue_on_error: true
    - delay: { seconds: "{{ start_delay | default(0) | int }}" }
    # Désactiver l'éclairage automatique par mouvement pendant le jeu
    - action: automation.turn_off
      data: { stop_actions: true }
      target:
        entity_id: "{{ label_entities('motions') }}"
    # Le bureau garde son plafonnier éteint et sa lampe d'appoint en « glisten » :
    # sans couper la synchro, éteindre light.office éteindrait aussi la lampe.
    # reset_after_escape_roome la rallume (comme pour la v1).
    - action: automation.turn_off
      data: { stop_actions: true }
      target:
        entity_id: automation.sync_auxiliary_light_with_main_light
    # --- PHASE 0 : la police arrive ---
    # Seulement les pièces en jeu, comme la v1 : la chambre est un no-go, la
    # salle de bain et l'extérieur ne servent à rien. Moins de lampes touchées,
    # c'est aussi moins d'attente avant que le noir soit fait.
    - action: light.turn_off
      target:
        area_id:
          - living_room
          - dining_room
          - kitchen
          - hallway
          - entrance
          - downstairs_hallway
          - eric_office
          - theatre
      data: { transition: 2 }
    - delay: { seconds: 2 }
    - action: media_player.volume_set
      target: { entity_id: media_player.sonos }
      data: { volume_level: 0.8 }
    - action: media_player.play_media
      target: { entity_id: media_player.sonos }
      data:
        media_content_type: audio/mpeg
        media_content_id: "media-source://media_source/local/Police Sirens.mp3"
    # Gyrophares bleu/rouge lancés en tâche de fond. Les Govee du salon
    # traînent tellement que la boucle débordait largement la sirène, et comme
    # elle bloquait le script, tout le reste de la phase 0 partait en retard.
    # Le son garde désormais son propre tempo (délais calés sur la durée réelle
    # des fichiers) et la lumière tourne à côté.
    # 9 alternances : le tiers de ce qu'il y avait, dans l'esprit des 5 cycles
    # de la v1. À ajuster à l'œil, c'est un nombre de flashs, pas une durée.
    - action: script.turn_on
      target: { entity_id: script.mystery_flash_alternate }
      data:
        variables:
          light_a: light.left_floor_lamp
          light_b: light.right_floor_lamp
          color_a: [0, 0, 255]
          color_b: [255, 0, 0]
          cycles: 9
          interval: 0.3
    # Durée réelle de la sirène (18,5 s) : c'est elle qui rythme la scène.
    - delay: { seconds: 19 }
    # Le brouhaha de policiers qui débarquent : fond de scène, pas un effet,
    # donc moitié moins fort que la sirène.
    - action: media_player.volume_set
      target: { entity_id: media_player.sonos }
      data: { volume_level: 0.4 }
    - action: media_player.play_media
      target: { entity_id: media_player.sonos }
      data:
        media_content_type: audio/mpeg
        media_content_id: "media-source://media_source/local/Police Radio Chatter.mp3"
    - delay: { seconds: 12 }
    # On coupe net : l'inspecteur prend la parole par-dessus ses hommes.
    - action: media_player.media_stop
      target: { entity_id: media_player.sonos }
      continue_on_error: true
    # --- PHASE 1a : le briefing se fait EN PERSONNE, sur le Sonos ---
    # C'est le changement clé : au téléphone, une seule personne tient le
    # combiné et les autres n'entendent rien. Sur le Sonos, tout le groupe
    # reçoit la consigne en même temps.
    # ⚠️ Pas de mots en majuscules dans les messages TTS : ils sont épelés
    # lettre à lettre et rendent la consigne inaudible.
    - action: script.mystery_inspector_say
      data:
        on_sonos: true
        message: >-
          Bonsoir. Ici inspecteur Henri-Onésime de Beauchamp-Latulippe.
          {% if player_name %}Vous devez être {{ player_name }}. Enchanté
          de faire votre connaissance.{% endif %} Un meurtre a eu lieu ici ce
          soir, et la maison a tout enregistré! Je vous nomme détectives.
          Trouvez-moi le coupable parmi trois suspects : le Jardinier,
          l'Héritière et le Majordome. Fouillez partout — ces trois-là se
          trahissent dès qu'on touche à leurs affaires. Bon. Il faut que j'y
          aille, j'ai un autre appel.
    # Il repart. La voiture s'éloigne, puis on laisse le silence retomber.
    # Retour au niveau du brouhaha : l'inspecteur avait monté le Sonos pour
    # porter dans la pièce.
    - action: media_player.volume_set
      target: { entity_id: media_player.sonos }
      data: { volume_level: 0.4 }
    - action: media_player.play_media
      target: { entity_id: media_player.sonos }
      data:
        media_content_type: audio/mpeg
        media_content_id: "media-source://media_source/local/Car Drive Away.mp3"
    - delay: { seconds: 12 }
    - delay: { seconds: 8 }
    # --- PHASE 1b : il rappelle au téléphone pour ce qu'il a oublié ---
    # Une seule information, celle qui envoie les joueurs quelque part.
    # Pas de sonnerie à jouer : le téléphone sonne déjà de lui-même.
    - action: script.mystery_inspector_say
      data:
        message: >-
          Ici Inspecteur Beauchamp-Latulippe. J'oubliais ! Les caméras de
          surveillance de la maison sont sur le terminal, dans le bureau au
          sous-sol. J'ai fait allumer les lumières jusque-là, suivez-les. Et si
          vous bloquez, demandez-moi un indice au téléphone.
    - action: input_select.select_option
      target: { entity_id: input_select.mystery_phase }
      data: { option: investigation }
    # L'ambiance (musique + lumières) doit démarrer après le passage en
    # « investigation » : sa boucle s'arrête dès que la phase en sort.
    - action: script.turn_on
      target: { entity_id: script.mystery_ambience }
    # « Suivez les lumières » : la traînée mène au bureau du sous-sol, là où se
    # trouvent le terminal et les premiers indices. Elle se déroule après la
    # musique, sinon les joueurs la regardent dans le silence.
    # Le plafonnier du bureau (light.office) reste éteint : c'est la lampe
    # d'appoint, allumée en « glisten » par l'ambiance, qui balise la pièce,
    # et l'écran du terminal fait le reste.
    - action: script.mystery_guide_path
      data:
        lights:
          - light.chandelier
          - light.downstairs_hallway_light

mystery_suspect_speak:
  alias: "Mystery - Suspect speaks"
  icon: mdi:incognito
  mode: queued
  max: 5
  fields:
    suspect:
      name: Suspect
      selector:
        select:
          options: ["gardener", "heiress", "butler"]
      required: true
    custom_line:
      name: Custom line
      description: >-
        Réplique ponctuelle (porte-patio, tiroir à couteaux, marmonnements) :
        elle emprunte la voix et l'enceinte du suspect sans compter comme un
        témoignage.
      selector: { text: { multiline: true } }
      default: ""
    variant:
      name: Variant
      description: >-
        Objet qui a déclenché le suspect. Ne change que l'entrée en matière,
        le témoignage reste le même.
      selector: { text: {} }
      default: ""
  variables:
    speaker: >-
      {{ {'gardener': 'media_player.workshop_echo',
          'heiress': 'media_player.sonos',
          'butler': 'media_player.google_home_mini'}[suspect] }}
    done_flag: >-
      {{ {'gardener': 'input_boolean.mystery_gardener_done',
          'heiress': 'input_boolean.mystery_heiress_done',
          'butler': 'input_boolean.mystery_butler_done'}[suspect] }}
    is_testimony: "{{ not custom_line }}"
    # L'Héritière a 2 déclencheurs indépendants (trappe du fusil, porte de la
    # buanderie) : sa réplique de répétition doit savoir lequel a déjà été vu,
    # même si l'autre a fourni le tout premier témoignage (done_flag ne dit
    # que « je lui ai déjà parlé », pas « par quelle porte »).
    heiress_gun_seen: >-
      {{ is_state('input_boolean.mystery_heiress_gun_seen', 'on')
         or (suspect == 'heiress' and is_testimony and variant != 'laundry') }}
    heiress_dress_seen: >-
      {{ is_state('input_boolean.mystery_heiress_dress_seen', 'on')
         or (suspect == 'heiress' and is_testimony and variant == 'laundry') }}
    # L'Héritière n'a pas de lampe à elle : les deux du salon appartiennent à la
    # boucle d'ambiance, qui les repeindrait 8 s plus tard. Elle parle sur le
    # Sonos, au milieu de cette ambiance — le repère de pièce est déjà là.
    room_light: >-
      {{ {'gardener': 'light.downstairs_hallway_light',
          'heiress': '',
          'butler': 'light.dining_room_pendants'}[suspect] }}
    # ⚠️ Le Jardinier passe par le TTS d'Amazon, qui mange les élisions
    # familières (« ch'te », « y'arrêtait ») : ses répliques restent en mots
    # entiers, sinon il marmonne. Chaque réplique finit par une consigne
    # explicite — sans ça les joueurs restaient plantés là.
    first_line: >-
      {% if suspect == 'gardener' %}
      Hé, c'est quoi cette histoire de détective ? Moi, j'ai rien vu, je le
      jure. J'ai passé la soirée icite, dans l'atelier, à aiguiser ma scie
      rouge. Vraiment chill man. Mais si tu veux mon avis, le Majordome, lui
      y'er louche en tabarnak: il arrêtait pas de tourner autour de la salle à
      manger avec sa bouteille de vin, le câlice. Monte donc voir de ce
      côté-là. Et fais attention à mon robot, il fait sa ronde.
      {% elif suspect == 'heiress' %}
      {% if variant == 'laundry' %}
      Heille ! Fouillez pas dans mon linge sale, vous autres ! Ma robe de
      soirée est là-dedans, pis oui, elle est tachée. Mais c'est du vin, ça,
      pas du sang ! On m'en a renversé un plein verre dessus.
      {% else %}
      Heille, mon fusil ?! Ben voyons donc, c'est pas ce que vous pensez
      pantoute ! OK, oui, je l'ai caché dans la trappe du foyer, mais je m'en
      suis jamais servie, j'vous le jure ! Je suis une femme ben distinguée
      quand même, on va pas me faire passer pour une calice de criminelle !
      Non madame.
      {% endif %}
      Si vous cherchez de quoi avancer, c'est pas moi qu'il faut regarder. Moi,
      j'irais fouiller l'étagère à vins — il doit bien se cacher quelque chose
      là-dedans. Tenez, je pars mon robot, il s'en va justement par là.
      Suivez-le.
      {% else %}
      Vous avez sonné pour le service ? À votre entière disposition. J'ai servi
      le vin toute la soirée, comme il se doit. Un service irréprochable.
      L'Héritière, en revanche, ne décolérait pas contre la victime : une
      sordide histoire d'héritage. Et puisque vous fouillez, examinez donc la
      robe de celle-ci dans la buanderie. Elle avait fait toute qu'un drama ce
      soir au souper !
      {% endif %}
    repeat_line: >-
      {% if suspect == 'gardener' %}
      J'te l'ai déjà dit. J'étais dans l'atelier toute la soirée. Cherche
      ailleurs. Va voir le soulon de Majordome et sa bouteille de vin.
      {% elif suspect == 'heiress' %}
      {% if heiress_gun_seen and heiress_dress_seen %}
      Heille, tabarnak, lâchez mes affaires tranquilles ! Ni le fusil ni ma
      robe ont rapport là-dedans, je vous le jure.
      {% elif heiress_gun_seen %}
      Girouette de St-Miséricorde! Vas-tu bien lâchez mes affaires ? Le fusil,
      ça prouve rien pantoute, je vous le jure.
      {% else %}
      Câlice, lâchez mes affaires tranquilles ! Ma robe, c'est rien que du vin
      renversé, je vous le jure.
      {% endif %}
      Pis arrêtez de me niaiser avec ça : mon robot est déjà parti vous
      montrer où chercher. J'lai vu le Majordome, y'avait un sac à vin
      contenant sa meilleur bouteille, y'a clairement laisser des traces de
      son passage dans le sac !
      {% else %}
      Le service, toujours le service. Le vin était... parfait. Enfin,
      presque. Je n'ai rien vu de suspect de mon côté. Aller donc voir
      l'Héritière, elle a été bien plus agitée que moi ce soir. Et si vous
      voulez mon avis, le Jardinier est un peu louche lui aussi. Il traîne
      toujours dans son atelier, à bricoler.
      {% endif %}
    line: >-
      {{ custom_line if custom_line
         else (first_line if is_state(done_flag, 'off') else repeat_line) }}
    # Le TTS ne bloque pas : on estime la durée de la réplique (~2,3 mots par
    # seconde en français) pour enchaîner sans couper le suspect.
    speech_seconds: "{{ [(line.split() | count / 2.3) | round(0, 'ceil') | int, 8] | max }}"
    # Une voix distincte par suspect, sinon les 3 personnages sont
    # indiscernables. ⚠️ Il faut le voice_id de l'API (« SylvieNeural »), pas
    # le nom affiché dans l'UI (« Sylvie ») : un nom invalide est ignoré en
    # silence et HA retombe sur la voix par défaut de la langue.
    # Le Jardinier n'est pas dans la liste : sa voix vient d'Alexa (voir plus
    # bas), mais la clé doit exister car le dictionnaire est évalué pour tous.
    voice: >-
      {{ {'gardener': '',
          'heiress': 'SylvieNeural',
          'butler': 'ThierryNeural'}[suspect] }}
  sequence:
    # La pièce d'où sort la voix s'éclaire : c'est ce qui dit aux joueurs où se
    # trouve celui qui parle.
    - if: "{{ room_light != '' }}"
      then:
        - action: light.turn_on
          target: { entity_id: "{{ room_light }}" }
          data: { brightness_pct: 60, transition: 1 }
          continue_on_error: true
    # Le Jardinier passe par notify et non par tts.speak : l'intégration
    # alexa_devices refuse toute URL média (« music is not available as a music
    # provider »), donc tts.speak échoue systématiquement sur l'Echo. C'est le
    # TTS d'Alexa qui parle, sa voix se règle dans l'app Alexa, pas ici.
    - if: "{{ suspect == 'gardener' }}"
      then:
        - action: notify.send_message
          target: { entity_id: notify.echo_speak }
          data:
            message: "{{ line }}"
      else:
        # L'Héritière parle sur le Sonos qui joue déjà l'ambiance : le TTS duck
        # automatiquement la musique (comportement natif Sonos, comme en v1),
        # donc on ne touche pas au volume du Sonos. Le Majordome garde le
        # volume fixé au démarrage de la partie.
        - if: "{{ suspect == 'heiress' }}"
          then:
            - action: script.turn_on
              target: { entity_id: script.mystery_sonos_glow }
              data:
                variables: { duration_seconds: "{{ speech_seconds }}" }
              continue_on_error: true
        - action: tts.speak
          target: { entity_id: tts.home_assistant_cloud }
          data:
            cache: true
            language: fr-CA
            media_player_entity_id: "{{ speaker }}"
            message: "{{ line }}"
            options:
              voice: "{{ voice }}"
    # Le drapeau « vu » de la porte concernée bascule à chaque témoignage de
    # l'Héritière, pas seulement au premier : c'est lui qui permet à
    # repeat_line de savoir si l'autre porte a aussi été ouverte depuis.
    - if: "{{ suspect == 'heiress' and is_testimony }}"
      then:
        - action: input_boolean.turn_on
          target:
            entity_id: >-
              {{ 'input_boolean.mystery_heiress_dress_seen' if variant == 'laundry'
                 else 'input_boolean.mystery_heiress_gun_seen' }}
    # Les répliques ponctuelles (patio, tiroir) empruntent la voix d'un suspect
    # sans être un témoignage : ni drapeau, ni robot.
    - if: "{{ is_testimony and is_state(done_flag, 'off') }}"
      then:
        # Le drapeau bascule tout de suite : ce script est en mode queued, un
        # blocage ici rendrait les autres suspects muets. C'est aussi lui qui
        # empêche un 2e départ de Roby si on redéplace la trappe du fusil.
        - action: input_boolean.turn_on
          target: { entity_id: "{{ done_flag }}" }
        # Roby a deux parcours, chacun déclenché par une 1re rencontre :
        #  - Héritière (salon, à côté du dock) : il part vers le vin sous les
        #    yeux des joueurs, qui le suivent jusqu'au bouton « service ».
        #  - Jardinier (atelier, en bas) : il file discrètement vers le rack
        #    d'épices pendant qu'ils sont en bas ; en remontant, ils le
        #    cherchent et le retrouvent au son du locate.
        # On passe par script.turn_on : le trajet plus le lead-in dépassent la
        # minute et un appel direct bloquerait ce script.
        - if: "{{ suspect in ['heiress', 'gardener'] }}"
          then:
            - action: script.turn_on
              target: { entity_id: script.mystery_roby_goto }
              data:
                variables:
                  destination: "{{ 'wine' if suspect == 'heiress' else 'spices' }}"
                  lead_in_seconds: "{{ speech_seconds }}"
              continue_on_error: true

mystery_police_callback:
  alias: "Mystery - Police callback (autopsy)"
  icon: mdi:incognito
  mode: single
  sequence:
    - action: media_player.media_stop
      target: { entity_id: media_player.sonos }
      continue_on_error: true
    - action: input_select.select_option
      target: { entity_id: input_select.mystery_phase }
      data: { option: autopsy_done }
    # Pas de sonnerie à jouer : le téléphone sonne déjà de lui-même à l'appel.
    - action: script.mystery_inspector_say
      data:
        message: >-
          Beauchamp-Latulippe à nouveau. J'ai eu le rapport de l'autopsie :
          la victime a été empoisonnée. Avez-vous trouvé les trois pièces à
          conviction possible ? Dès que vous les avez, tapez-les sur le
          terminal du bureau.
    # L'ambiance a été coupée plus haut pour ne pas couvrir l'inspecteur : on la
    # relance, sinon l'enquête se poursuit dans le silence.
    - action: script.turn_on
      target: { entity_id: script.mystery_ambience }
    # La piste est maintenant la salle à manger : on y rallume le chemin.
    - action: script.mystery_guide_path
      data:
        lights:
          - light.hallway_lights
          - light.dining_room_pendants

mystery_hint:
  alias: "Mystery - Hint"
  icon: mdi:lightbulb-question
  mode: single
  # Le seul texte du jeu qui s'adapte à l'avancement.
  # ⚠️ Il dit QUI il reste à traiter, jamais OÙ ni COMMENT : donner l'endroit
  # exact revenait à jouer la partie à leur place. La relance, c'est toujours
  # « retournez voir les caméras » — c'est là que se trouve la vraie piste.
  variables:
    # « du Jardinier, de l'Héritière et du Majordome », avec le « et » final.
    # Les deux listes s'emploient toujours après « de » : la contraction est
    # déjà dans les libellés, sinon l'inspecteur dit « de le Jardinier ».
    pending_testimony: >-
      {% set ns = namespace(who=[]) %}
      {% if is_state('input_boolean.mystery_gardener_done', 'off') %}
        {% set ns.who = ns.who + ['du Jardinier'] %}
      {% endif %}
      {% if is_state('input_boolean.mystery_heiress_done', 'off') %}
        {% set ns.who = ns.who + ["de l'Héritière"] %}
      {% endif %}
      {% if is_state('input_boolean.mystery_butler_done', 'off') %}
        {% set ns.who = ns.who + ['du Majordome'] %}
      {% endif %}
      {% if ns.who %}{{ ns.who[:-1] | join(', ') }}{{ ' et ' if ns.who | count > 1 }}{{ ns.who | last }}{% endif %}
    pending_evidence: >-
      {% set ns = namespace(who=[]) %}
      {% if is_state('input_boolean.mystery_evidence_saw', 'off') %}
        {% set ns.who = ns.who + ['du Jardinier'] %}
      {% endif %}
      {% if is_state('input_boolean.mystery_evidence_gun', 'off') %}
        {% set ns.who = ns.who + ["de l'Héritière"] %}
      {% endif %}
      {% if is_state('input_boolean.mystery_evidence_poison', 'off') %}
        {% set ns.who = ns.who + ['du Majordome'] %}
      {% endif %}
      {% if ns.who %}{{ ns.who[:-1] | join(', ') }}{{ ' et ' if ns.who | count > 1 }}{{ ns.who | last }}{% endif %}
    # Les 3 objets étiquetés d'un code, à enregistrer au terminal du bureau :
    # c'est ce compteur qui commande le déverrouillage du dossier confidentiel.
    evidence_found: >-
      {{ ['input_boolean.mystery_evidence_saw',
          'input_boolean.mystery_evidence_gun',
          'input_boolean.mystery_evidence_poison']
         | map('states') | select('eq', 'on') | list | count }}
    hint: >-
      {% set phase = states('input_select.mystery_phase') %}
      {% if phase == 'investigation' and pending_testimony | trim %}
      Il me manque encore le témoignage {{ pending_testimony | trim }}.
      Repassez donc par les caméras du bureau, elles en disent plus long que
      moi.
      {% elif phase == 'investigation' %}
      Vous avez les trois témoignages. Ne bougez pas, je vous rappelle.
      {% elif phase == 'autopsy_done' and evidence_found | int < 3 %}
      {{ evidence_found }} pièce{{ 's' if evidence_found | int > 1 else '' }} à
      conviction sur trois. Il me manque celle
      {{ pending_evidence | trim }}. Les caméras du bureau montrent chacun avec
      son arme — regardez-les encore, vous saurez quoi chercher.
      {% elif phase == 'autopsy_done' %}
      Les trois pièces sont au dossier. Désignez le coupable sur le terminal.
      {% elif phase == 'accusation' %}
      Je vous écoute : désignez le coupable sur le terminal.
      {% else %}
      Il n'y a pas d'enquête en cours, détective.
      {% endif %}
  sequence:
    - action: script.mystery_inspector_say
      data:
        message: "{{ hint }}"
        # Pendant l'accusation, les joueurs sont devant le terminal : l'indice
        # sort là plutôt qu'au téléphone resté au salon. Le reste du temps ils
        # l'ont demandé au combiné, donc il répond au combiné.
        on_terminal: "{{ states('input_select.mystery_phase') == 'accusation' }}"

mystery_denouement:
  alias: "Mystery - Denouement"
  icon: mdi:incognito
  mode: single
  fields:
    accused:
      name: Accused suspect
      description: "Id du suspect désigné : gardener, heiress ou butler."
      selector: { text: {} }
      default: ""
  variables:
    # La solution du scénario n'est écrite qu'ici. Les deux chemins d'accusation
    # (terminal et téléphone) ne font que transmettre un nom, sinon changer de
    # coupable pour une variante casserait silencieusement l'un des deux.
    culprit: butler
    success: "{{ accused == culprit }}"
  sequence:
    - if: "{{ success }}"
      then:
        # Sortir de la phase d'enquête arrête aussi la boucle d'ambiance.
        - action: input_select.select_option
          target: { entity_id: input_select.mystery_phase }
          data: { option: solved }
        - action: media_player.media_stop
          target: { entity_id: media_player.sonos }
          continue_on_error: true
        # Les joueurs viennent de cliquer sur le terminal, au sous-sol :
        # c'est là qu'ils sont, pas au téléphone du salon.
        - action: script.mystery_inspector_say
          data:
            on_terminal: true
            message: >-
              Le Majordome. C'est exact, détective ! Appelez-moi Henri, vous
              l'avez mérité. Descendez au théâtre, j'ai trouvé de quoi qui
              pourrait vous intéresser : suivez les lumières, et regardez
              l'écran.
        - action: script.mystery_guide_path
          data:
            lights:
              - light.hallway_lights
              - light.downstairs_hallway_light
        # Mise en scène : la salle s'éteint, puis les trois toiles tombent
        # l'une après l'autre comme un rideau de théâtre, avant que la lumière
        # rouge ne monte lentement sur l'écran.
        - action: light.turn_off
          target:
            entity_id:
              - light.theatre
              - light.wooden_lamp
              - light.metal_lamp
              - light.bad_light
          data: { transition: 2 }
          continue_on_error: true
        - repeat:
            for_each:
              - cover.theatre_left_shade
              - cover.theatre_middle_shade
              - cover.theatre_right_shade
            sequence:
              - action: cover.close_cover
                target: { entity_id: "{{ repeat.item }}" }
                continue_on_error: true
              - delay: { milliseconds: 1200 }
        - action: media_player.turn_on
          target: { entity_id: media_player.theatre_tv }
          continue_on_error: true
        - action: light.turn_on
          target: { entity_id: light.theatre }
          data: { rgb_color: [255, 0, 0], brightness_pct: 8 }
          continue_on_error: true
        - action: light.turn_on
          target: { entity_id: light.theatre }
          data: { rgb_color: [255, 0, 0], brightness_pct: 70, transition: 6 }
          continue_on_error: true
        - delay: { seconds: 6 }
        # TEMPORAIRE : en attendant que « Final Reveal.mp4 » soit produit, on
        # rickroll les joueurs — sur la TV du théâtre, seul écran de la pièce
        # où l'inspecteur vient de les envoyer.
        - action: media_player.play_media
          target: { entity_id: media_player.theatre_tv }
          data:
            media_content_type: audio/mpeg
            media_content_id: "media-source://media_source/local/Never Gonna Give You Up.mp3"
          continue_on_error: true
        # La salle bascule en boîte de nuit le temps de la chanson : les deux
        # lampes se renvoient les couleurs, lentement, chacune à son tour.
        # Non bloquant, sinon le script resterait pris une minute.
        - action: script.turn_on
          target: { entity_id: script.mystery_flash_alternate }
          data:
            variables:
              light_a: light.theatre
              light_b: light.metal_lamp
              color_a: [255, 0, 60]
              color_b: [0, 120, 255]
              cycles: 20
              interval: 0.6
      else:
        - action: input_select.select_option
          target: { entity_id: input_select.mystery_phase }
          data: { option: autopsy_done }
        - action: media_player.play_media
          target: { entity_id: media_player.sonos }
          data:
            media_content_type: audio/mpeg
            media_content_id: "media-source://media_source/local/Wrong Answer Sting.mp3"
        # Le sting dure 14 s, bien trop pour ce moment : on n'en garde que
        # l'attaque puis on coupe, sinon il déborde sur la voix de l'inspecteur
        # (qui parle dans le téléphone et ne coupe donc rien sur le Sonos).
        - delay: { seconds: 3 }
        - action: media_player.media_stop
          target: { entity_id: media_player.sonos }
          continue_on_error: true
        # Les joueurs viennent de cliquer sur le terminal, au sous-sol :
        # c'est là qu'ils sont, pas au téléphone du salon.
        - action: script.mystery_inspector_say
          data:
            on_terminal: true
            message: >-
              Non. Ça ne colle pas, détective. Et c'est Beauchamp-Latulippe.
              Reprenez le vin et les alibis. Revenez me voir quand vous serez
              sûrs.
        # Le sting a remplacé l'ambiance sur le Sonos : on la relance, sinon la
        # partie continue sans musique après une mauvaise accusation.
        - action: script.turn_on
          target: { entity_id: script.mystery_ambience }
